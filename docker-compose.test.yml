# Postgres test DB (optional). App uses POSTGRES_* from env when set.
# Example:
#   docker compose -f docker-compose.test.yml up -d
#   POSTGRES_HOST=127.0.0.1 POSTGRES_DB=bookworms_test \
#     POSTGRES_USER=bookworms POSTGRES_PASSWORD=bookworms \
#     python manage.py test mainApp.tests.repositories
#
# Without POSTGRES_HOST, Django TestCase uses SQLite (still a real DB file).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookworms_test
      POSTGRES_USER: bookworms
      POSTGRES_PASSWORD: bookworms
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookworms -d bookworms_test"]
      interval: 3s
      timeout: 3s
      retries: 20
