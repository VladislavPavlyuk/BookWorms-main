# QNAP TS-233 (ARM64, 2GB RAM) — Postgres + Django API + Nginx
# Container Station: Application → Create → docker-compose
# Порт 8088, щоб не битися з UI QNAP (8080/443).
#
# cp deploy/qnap/.env.example .env
# docker compose -f docker-compose.qnap.yml up -d --build

name: date-due-slip

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookworms}
      POSTGRES_USER: ${POSTGRES_USER:-bookworms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=30
      - -c
      - effective_cache_size=128MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookworms} -d ${POSTGRES_DB:-bookworms}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks:
      - lan

  api:
    build:
      context: .
      dockerfile: deploy/qnap/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-bookworms}
      POSTGRES_USER: ${POSTGRES_USER:-bookworms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-192.168.0.213,localhost,127.0.0.1,api}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://192.168.0.213:8088}
      SKIP_EMAIL_ACTIVATION: ${SKIP_EMAIL_ACTIVATION:-1}
      DEFAULT_LOAN_DAYS: ${DEFAULT_LOAN_DAYS:-14}
      TIME_ZONE: ${TIME_ZONE:-Europe/Kyiv}
      GUNICORN_WORKERS: "1"
      GUNICORN_THREADS: "2"
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@local}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    mem_limit: 384m
    networks:
      - lan

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8088:80"
    volumes:
      - ./deploy/qnap/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media:/app/media:ro
      - staticfiles:/app/staticfiles:ro
    mem_limit: 32m
    networks:
      - lan

volumes:
  pgdata:
  media:
  staticfiles:

networks:
  lan:
    driver: bridge
