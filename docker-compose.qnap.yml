# QNAP TS-233: НЕ створювати user-defined bridge (lan) —
# QNET вішає NAT/dnsmasq на br-* → "dnsmasg add fail".
# docker0 + links: DNS імен postgres/api через /etc/hosts.
#
# cd /share/Container/BookWorms-main
# cp deploy/qnap/.env.example .env && vi .env
# docker compose -f docker-compose.qnap.yml up -d --build

name: date-due-slip

services:
  postgres:
    image: postgres:16-alpine
    container_name: dds-postgres
    restart: unless-stopped
    network_mode: bridge
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookworms}
      POSTGRES_USER: ${POSTGRES_USER:-bookworms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=30
      - -c
      - effective_cache_size=128MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookworms} -d ${POSTGRES_DB:-bookworms}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  api:
    build:
      context: .
      dockerfile: deploy/qnap/api/Dockerfile
      args:
        CACHEBUST: ${CACHEBUST:-1}
    container_name: dds-api
    restart: unless-stopped
    network_mode: bridge
    env_file:
      - .env
    depends_on:
      - postgres
    links:
      - postgres:postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-bookworms}
      POSTGRES_USER: ${POSTGRES_USER:-bookworms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-192.168.0.213,localhost,127.0.0.1,api,datedueslip.com}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://192.168.0.213:18088,http://datedueslip.com,https://datedueslip.com}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://192.168.0.213:18088}
      SKIP_EMAIL_ACTIVATION: ${SKIP_EMAIL_ACTIVATION:-0}
      ACTIVATION_TIMEOUT_MINUTES: ${ACTIVATION_TIMEOUT_MINUTES:-5}
      WEB3FORMS_ACCESS_KEY: ${WEB3FORMS_ACCESS_KEY:-d76edac5-49fd-4574-b89b-45e24170aeab}
      DEFAULT_LOAN_DAYS: ${DEFAULT_LOAN_DAYS:-14}
      TIME_ZONE: ${TIME_ZONE:-Europe/Kyiv}
      OPENLIBRARY_CONTACT_EMAIL: ${OPENLIBRARY_CONTACT_EMAIL:-admin@datedueslip.com}
      OPENLIBRARY_USER_AGENT: ${OPENLIBRARY_USER_AGENT:-DateDueSlip/1.0 (mailto:admin@datedueslip.com)}
      GUNICORN_WORKERS: "1"
      GUNICORN_THREADS: "4"
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@local}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      # за проксі nginx — коректні absolute URI / CSRF
      USE_X_FORWARDED_HOST: "1"
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  nginx:
    image: nginx:1.27-alpine
    container_name: dds-nginx
    restart: unless-stopped
    network_mode: bridge
    depends_on:
      - api
    links:
      - api:api
    ports:
      - "18088:80"
    volumes:
      - ./deploy/qnap/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media:/app/media:ro
      - staticfiles:/app/staticfiles:ro
    mem_limit: 32m

volumes:
  pgdata:
  media:
  staticfiles:
